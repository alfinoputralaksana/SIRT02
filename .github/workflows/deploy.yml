name: Deploy Laravel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fail_on_missing_secrets:
        description: 'true = fail if no deploy password is configured; false = skip gracefully'
        required: false
        default: 'false'

jobs:
  deploy:
    name: Deploy to cPanel
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ftp.sirt02.my.id
      FTP_USERNAME: sirt02@sirt02.my.id
      DEPLOY_METHOD: ${{ secrets.DEPLOY_METHOD || 'ftps' }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      SFTP_PASSWORD: ${{ secrets.SFTP_PASSWORD }}
      SFTP_PRIVATE_KEY: ${{ secrets.SFTP_PRIVATE_KEY }}
      FAIL_ON_MISSING_SECRETS: ${{ secrets.FAIL_ON_MISSING_SECRETS }}

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Report configured deploy settings
        run: |
          echo "FTP_SERVER=$FTP_SERVER"
          echo "FTP_USERNAME=$FTP_USERNAME"
          if [ -n "$FTP_PASSWORD" ]; then
            echo "FTP_PASSWORD_SET=true"
          else
            echo "FTP_PASSWORD_SET=false"
          fi
          if [ -n "$SFTP_PASSWORD" ]; then
            echo "SFTP_PASSWORD_SET=true"
          else
            echo "SFTP_PASSWORD_SET=false"
          fi
          if [ -n "$SFTP_PRIVATE_KEY" ]; then
            echo "SFTP_PRIVATE_KEY_SET=true"
          else
            echo "SFTP_PRIVATE_KEY_SET=false"
          fi
          echo "DEPLOY_METHOD=$DEPLOY_METHOD"
          echo "FAIL_ON_MISSING_SECRETS=$FAIL_ON_MISSING_SECRETS"

      - name: Install Composer Dependencies
        run: |
          composer install             --no-ansi             --no-dev             --no-interaction             --no-plugins             --no-progress             --no-scripts             --optimize-autoloader

      - name: Deploy via FTP/FTPS
        if: ${{ env.DEPLOY_METHOD != 'sftp' && env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ${{ env.DEPLOY_METHOD }}
          port: 21
          local-dir: ./
          server-dir: laravel-core/
          exclude: |
            **/.git*
            **/node_modules/**
            **/vendor/**
            **/public/**

      - name: Deploy public folder via FTP/FTPS
        if: ${{ env.DEPLOY_METHOD != 'sftp' && env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          protocol: ${{ env.DEPLOY_METHOD }}
          port: 21
          local-dir: ./public/
          server-dir: public_html/

      - name: Deploy via SFTP
        if: ${{ env.DEPLOY_METHOD == 'sftp' && (env.SFTP_PASSWORD != '' || env.SFTP_PRIVATE_KEY != '') }}
        uses: appleboy/scp-action@master
        with:
          host: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.SFTP_PASSWORD }}
          key: ${{ env.SFTP_PRIVATE_KEY }}
          port: 22
          source: "./public/"
          target: "public_html/"

      - name: Deployment Summary
        run: |
          if [ "$DEPLOY_METHOD" = 'sftp' ]; then
            echo "✓ Attempted SFTP deployment"
          elif [ -n "$FTP_PASSWORD" ]; then
            echo "✓ Attempted FTP/FTPS deployment"
          else
            echo "⚠ No deploy password configured. Skipping deploy."
            if [ "$FAIL_ON_MISSING_SECRETS" = "true" ] || [ "${{ github.event.inputs.fail_on_missing_secrets }}" = "true" ]; then
              echo "❌ Explicit fail enabled. Exiting with failure." >&2
              exit 1
            fi
          fi
