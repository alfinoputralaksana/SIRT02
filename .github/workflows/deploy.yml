name: Deploy Laravel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fail_on_missing_secrets:
        description: 'true = fail if no FTP password is set; false = skip gracefully'
        required: false
        default: 'false'

jobs:
  deploy:
    name: Deploy to cPanel via FTP
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ftp.sirt02.my.id
      FTP_USERNAME: sirt02@sirt02.my.id
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      FAIL_ON_MISSING_SECRETS: ${{ secrets.FAIL_ON_MISSING_SECRETS }}

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'

      - name: Report configured deploy settings
        run: |
          echo "FTP_SERVER=$FTP_SERVER"
          echo "FTP_USERNAME=$FTP_USERNAME"
          if [ -n "$FTP_PASSWORD" ]; then
            echo "FTP_PASSWORD_SET=true"
          else
            echo "FTP_PASSWORD_SET=false"
          fi
          echo "FAIL_ON_MISSING_SECRETS=$FAIL_ON_MISSING_SECRETS"

      - name: Install Composer Dependencies
        run: |
          composer install             --no-ansi             --no-dev             --no-interaction             --no-plugins             --no-progress             --no-scripts             --optimize-autoloader

      - name: Sync core to laravel-core/ via FTP
        if: ${{ env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          port: 21
          local-dir: ./
          server-dir: laravel-core/
          exclude: |
            **/.git*
            **/node_modules/**
            **/vendor/**
            **/public/**

      - name: Sync public/ to public_html/ via FTP
        if: ${{ env.FTP_PASSWORD != '' }}
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: ${{ env.FTP_SERVER }}
          username: ${{ env.FTP_USERNAME }}
          password: ${{ env.FTP_PASSWORD }}
          port: 21
          local-dir: ./public/
          server-dir: public_html/

      - name: Deployment Summary
        run: |
          fail_input="${{ github.event.inputs.fail_on_missing_secrets }}"
          if [ -n "$FTP_PASSWORD" ]; then
            echo "✓ FTP deployment completed to $FTP_SERVER"
          else
            echo "⚠ No FTP password configured. Skipping deploy."
            if [ "$FAIL_ON_MISSING_SECRETS" = "true" ] || [ "$fail_input" = "true" ]; then
              echo "❌ Explicit fail enabled. Exiting with failure." >&2
              exit 1
            fi
          fi
