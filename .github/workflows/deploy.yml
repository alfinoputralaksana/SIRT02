name: Deploy Laravel Framework

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  deploy:
    name: Build & Deploy to cPanel (Ultra Fast)
    runs-on: ubuntu-latest
    env:
      FTP_SERVER: ftp.sirt02.my.id
      FTP_USERNAME: ${{ secrets.FTP_USERNAME || 'sirt02@sirt02.my.id' }}
      FTP_PASSWORD: ${{ secrets.FTP_PASSWORD }}
      DEPLOY_METHOD: ${{ secrets.DEPLOY_METHOD || 'ftp' }}

    steps:
      - name: Get latest code
        uses: actions/checkout@v4

      - name: Setup PHP
        uses: shivammathur/setup-php@v2
        with:
          php-version: '8.2'
          extensions: mbstring, xml, ctype, iconv, json, zip, mysql

      - name: Install Composer Dependencies
        run: |
          composer install --no-ansi --no-dev --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader

      - name: Setup Node.js & Build Frontend Assets
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install & Build NPM
        run: |
          npm install
          npm run build

      - name: Package Application into Release Zip
        run: |
          mkdir -p deploy-dist
          # Compress all core and public files into a single zip package
          zip -r deploy-dist/release.zip . -x ".git*" "node_modules/*" "vendor/*" "storage/*" "tests/*" ".env*" "phpunit.xml" "README.md"
          
          # Create automated deployment runner
          cat << 'EOF' > deploy-dist/deploy_runner.php
          <?php
          echo "<pre>=== STARTING ULTRA-FAST DEPLOYMENT ===\n";
          
          // 1. Unzip release.zip
          if (file_exists(__DIR__.'/release.zip')) {
              echo "1. Extracting release.zip package...\n";
              $zip = new ZipArchive;
              if ($zip->open(__DIR__.'/release.zip') === TRUE) {
                  // Extract core files to /home/sirp7472/
                  $zip->extractTo('/home/sirp7472/');
                  $zip->close();
                  echo "   Extract Core Files OK!\n";

                  // Sync public files to public_html/sirt02.my.id
                  if (is_dir('/home/sirp7472/public')) {
                      @mkdir('/home/sirp7472/public_html/sirt02.my.id', 0755, true);
                      exec('cp -rf /home/sirp7472/public/* /home/sirp7472/public_html/sirt02.my.id/');
                      echo "   Sync Public Assets OK!\n";
                  }
              } else {
                  echo "   Zip extract failed!\n";
              }
          }
          
          // 2. Run Artisan commands
          if (file_exists('/home/sirp7472/vendor/autoload.php')) {
              require '/home/sirp7472/vendor/autoload.php';
              $app = require_once '/home/sirp7472/bootstrap/app.php';
              $kernel = $app->make(Illuminate\Contracts\Console\Kernel::class);
              
              echo "\n2. Executing Artisan Commands...\n";
              $kernel->call('migrate', ['--force' => true]);
              echo "   Migrate: " . trim($kernel->output()) . "\n";
              
              $kernel->call('db:seed', ['--force' => true]);
              echo "   Seed: " . trim($kernel->output()) . "\n";
              
              $kernel->call('optimize:clear');
              echo "   Optimize Clear: " . trim($kernel->output()) . "\n";
          }
          
          echo "\n3. Cleaning up deployment files...\n";
          @unlink(__DIR__.'/release.zip');
          @unlink(__FILE__);
          echo "=== DEPLOYMENT COMPLETED SUCCESSFULLY ===</pre>";
          EOF

      - name: Upload Package & Runner via cURL FTP (Single Transfer)
        run: |
          echo "Uploading release package..."
          curl --ftp-create-dirs -T deploy-dist/release.zip -u "${{ env.FTP_USERNAME }}:${{ env.FTP_PASSWORD }}" ftp://${{ env.FTP_SERVER }}/public_html/sirt02.my.id/release.zip
          echo "Uploading deployment runner..."
          curl --ftp-create-dirs -T deploy-dist/deploy_runner.php -u "${{ env.FTP_USERNAME }}:${{ env.FTP_PASSWORD }}" ftp://${{ env.FTP_SERVER }}/public_html/sirt02.my.id/deploy_runner.php

      - name: Trigger Remote Unpack & Auto-Clean
        run: |
          echo "Executing remote extraction & Artisan tasks..."
          curl -s https://sirt02.my.id/deploy_runner.php

      - name: Deployment Summary
        run: |
          echo "✓ Ultra-fast zip deployment completed in seconds!"