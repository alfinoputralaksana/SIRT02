name: Deploy Laravel

on:
  push:
    branches:
      - main
  workflow_dispatch:
    inputs:
      fail_on_missing_secrets:
        description: 'true = fail if no secrets; false = skip gracefully'
        required: false
        default: 'false'

jobs:
  web-deploy:
    name: Deploy to cPanel via FTP / SFTP / Artifact
    runs-on: ubuntu-latest
    env:
      FAIL_ON_MISSING_SECRETS: ${{ secrets.FAIL_ON_MISSING_SECRETS }}

    steps:
    - name: Get latest code
      uses: actions/checkout@v4

    - name: Setup PHP
      uses: shivammathur/setup-php@v2
      with:
        php-version: '8.2'

    - name: Report configured deploy secrets
      run: |
        echo "FTP_SERVER_SET=${{ secrets.FTP_SERVER != '' }}"
        echo "FTP_USERNAME_SET=${{ secrets.FTP_USERNAME != '' }}"
        echo "FTP_PASSWORD_SET=${{ secrets.FTP_PASSWORD != '' }}"
        echo "SFTP_HOST_SET=${{ secrets.SFTP_HOST != '' }}"
        echo "SFTP_USERNAME_SET=${{ secrets.SFTP_USERNAME != '' }}"
        echo "SFTP_PRIVATE_KEY_SET=${{ secrets.SFTP_PRIVATE_KEY != '' }}"
        echo "FAIL_ON_MISSING_SECRETS=${{ env.FAIL_ON_MISSING_SECRETS }}"

    - name: Install Composer Dependencies
      run: composer install --no-ansi --no-dev --no-interaction --no-plugins --no-progress --no-scripts --optimize-autoloader

    # ============================================================
    # FTP Deploy (Primary Method)
    # ============================================================
    - name: Sync Core to laravel-core/ via FTP
      if: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        local-dir: ./
        server-dir: ./laravel-core/
        exclude: |
          */.git
          */.git/**
          */node_modules/*
          */vendor/*
          */public/*

    - name: Sync public/ to public_html/ via FTP
      if: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
      uses: SamKirkland/FTP-Deploy-Action@v4.3.4
      with:
        server: ${{ secrets.FTP_SERVER }}
        username: ${{ secrets.FTP_USERNAME }}
        password: ${{ secrets.FTP_PASSWORD }}
        port: 21
        local-dir: ./public/
        server-dir: ./public_html/

    - name: Report FTP Success
      if: ${{ secrets.FTP_SERVER != '' && secrets.FTP_USERNAME != '' && secrets.FTP_PASSWORD != '' }}
      run: echo "✓ FTP deployment completed to ${{ secrets.FTP_SERVER }}"

    # ============================================================
    # SFTP/SSH Deploy (Alternative Method)
    # ============================================================
    - name: Sync via SFTP/SSH
      if: ${{ secrets.SFTP_HOST != '' && secrets.SFTP_USERNAME != '' && secrets.SFTP_PRIVATE_KEY != '' && (secrets.FTP_SERVER == '' || secrets.FTP_USERNAME == '' || secrets.FTP_PASSWORD == '') }}
      uses: appleboy/scp-action@master
      with:
        host: ${{ secrets.SFTP_HOST }}
        username: ${{ secrets.SFTP_USERNAME }}
        key: ${{ secrets.SFTP_PRIVATE_KEY }}
        port: ${{ secrets.SFTP_PORT || '22' }}
        source: "./public/"
        target: ${{ secrets.SFTP_TARGET_DIR || '/home/username/public_html/' }}

    - name: Report SFTP Success
      if: ${{ secrets.SFTP_HOST != '' && secrets.SFTP_USERNAME != '' && secrets.SFTP_PRIVATE_KEY != '' && (secrets.FTP_SERVER == '' || secrets.FTP_USERNAME == '' || secrets.FTP_PASSWORD == '') }}
      run: echo "✓ SFTP deployment completed to ${{ secrets.SFTP_HOST }}"

    # ============================================================
    # Artifact Upload (Fallback for Manual Deploy)
    # ============================================================
    - name: Upload build artifact for manual deploy
      if: ${{ (secrets.FTP_SERVER == '' || secrets.FTP_USERNAME == '' || secrets.FTP_PASSWORD == '') && (secrets.SFTP_HOST == '' || secrets.SFTP_USERNAME == '' || secrets.SFTP_PRIVATE_KEY == '') }}
      uses: actions/upload-artifact@v3
      with:
        name: laravel-build-${{ github.sha }}
        path: |
          public/
          app/
          bootstrap/
          config/
          database/
          resources/
          routes/
          storage/
          composer.json
          composer.lock
          .env.example
        retention-days: 7

    - name: Report Artifact Upload
      if: ${{ (secrets.FTP_SERVER == '' || secrets.FTP_USERNAME == '' || secrets.FTP_PASSWORD == '') && (secrets.SFTP_HOST == '' || secrets.SFTP_USERNAME == '' || secrets.SFTP_PRIVATE_KEY == '') }}
      run: echo "⚠ No deploy secrets configured. Build artifact uploaded for manual deployment."

    # ============================================================
    # Explicit Fail (if enabled)
    # ============================================================
    - name: Fail deployment if no method available and explicit-fail enabled
      if: ${{ (secrets.FTP_SERVER == '' || secrets.FTP_USERNAME == '' || secrets.FTP_PASSWORD == '') && (secrets.SFTP_HOST == '' || secrets.SFTP_USERNAME == '' || secrets.SFTP_PRIVATE_KEY == '') && (env.FAIL_ON_MISSING_SECRETS == 'true' || github.event.inputs.fail_on_missing_secrets == 'true') }}
      run: |
        echo "❌ DEPLOYMENT FAILED" >&2
        echo "No deploy method available (FTP or SFTP secrets missing)." >&2
        echo "Enable FTP by setting: FTP_SERVER, FTP_USERNAME, FTP_PASSWORD" >&2
        echo "Or enable SFTP by setting: SFTP_HOST, SFTP_USERNAME, SFTP_PRIVATE_KEY" >&2
        exit 1

    - name: Deployment Summary
      run: |
        echo "=== Workflow Complete ==="
        echo "Branch: ${{ github.ref }}"
        echo "Commit: ${{ github.sha }}"
